services:
  # Option 1: Docker Deployment (Recommended - Unified Full-Stack)
  - type: web
    name: digital-fraud-shield
    env: docker
    region: singapore
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./fraud_shield.db
