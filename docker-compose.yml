version: '3.8'

# Unified Single-Service Full-Stack Deployment
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./fraud_shield.db
      - JWT_SECRET=digital_fraud_shield_super_secret_jwt_key_2026
      - CORS_ORIGINS=*
    restart: always

# Note: Standalone multi-container frontend service is DEPRECATED.
# The React SPA is now built and served directly from the FastAPI Python backend under a single origin.
